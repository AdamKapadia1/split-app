# The function verifies the user JWT itself via auth.getUser.
# Gateway verification is off so OPTIONS preflight reaches the handler
# and rejected tokens return the function's structured 401 body.
project_id = "split-app"

[functions.scan-receipt]
verify_jwt = false

# The function verifies the user JWT itself via auth.getUser.
[functions.send-settlement-nudge]
verify_jwt = false

# Database webhook authenticates with x-webhook-secret, not a user JWT.
[functions.notify-host-paid]
verify_jwt = false

# Cron authenticates with x-cron-secret or the service role bearer.
[functions.check-push-receipts]
verify_jwt = false
